name: Ghost Relay CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: atltvri/sample-app:gha-sha-${{ github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test game
        run: |
          mkdir -p reports
          docker run --rm --network none --volume "$PWD:/app:ro" --workdir /app \
            node:24-bookworm-slim node --test --test-reporter=junit > reports/unit.xml

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-test-report
          path: reports/unit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=sample-app-amd64
          cache-to: type=gha,scope=sample-app-amd64,mode=max
          load: true

      - name: Smoke test container
        run: ./scripts/smoke-image.sh "$IMAGE"

      - name: Export tested image
        run: docker save "$IMAGE" | gzip -n > ghost-relay-linux-amd64.tar.gz

      - name: Upload tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gha-sha-${{ github.sha }}-linux-amd64
          path: ghost-relay-linux-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Sign in to Docker Hub
        id: registry_login
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: atltvri
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish tested image to Docker Hub
        if: steps.registry_login.outcome == 'success'
        run: docker push "$IMAGE"

      - name: Summarize image
        env:
          PUBLISHED: ${{ steps.registry_login.outcome }}
        run: |
          echo "Tested image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" = success ]; then
            echo "Published the tested image to Docker Hub." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tested image is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
